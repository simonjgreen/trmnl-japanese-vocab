name: CI

# Runs on untrusted pull requests, so it must never see a deployment secret.
# Nothing in this workflow reads `secrets`, and nothing here deploys.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Data, tests and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate corpus, provenance and schemas
        run: python -m kotoba.cli validate --json > validation-report.json || (cat validation-report.json; exit 1)

      - name: Confirm NOTICE.md is up to date
        run: |
          cp NOTICE.md NOTICE.md.committed
          python -m kotoba.cli validate --write-notice >/dev/null
          diff -u NOTICE.md.committed NOTICE.md || {
            echo "::error::NOTICE.md is stale; run 'make notice' and commit the result"
            exit 1
          }

      - name: Run tests
        run: python -m pytest -q

      - name: Build the static site
        # A short horizon: CI is checking correctness, not producing a
        # deployable artefact. pages.yml builds the full ten-year range.
        run: python -m kotoba.cli build-site --output site --past-days 7 --future-days 60

      - name: Validate the generated API
        run: python -m kotoba.cli validate-site --site site

      - name: Summarise the build
        run: |
          python -m kotoba.cli manifest --site site >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            validation-report.json
            site/api/v1/manifest.json
            site/health.json
          if-no-files-found: warn

  plugin:
    name: Plugin lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Build the trmnlp image
        # The same image used in local development: the official one carries
        # no CJK fonts, so a render would come out as tofu boxes. Using Docker
        # rather than `gem install trmnl_preview` also keeps CI on exactly the
        # tool version this project is tested against — the released gem is
        # older and has no `--png`.
        run: docker build -f Dockerfile.trmnlp -t kotoba/trmnlp:latest .

      - name: Lint the plugin
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/plugin" -w /plugin kotoba/trmnlp:latest lint

      - name: Render every view for every fixture
        run: python scripts/render_fixtures.py --png

      - name: Package the manual-import ZIP
        run: python scripts/package_plugin.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            dist/renders/**
            dist/*.zip
          if-no-files-found: error
