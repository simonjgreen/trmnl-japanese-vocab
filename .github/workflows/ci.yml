name: CI

# Runs on untrusted pull requests, so it must never see a deployment secret.
# Nothing in this workflow reads `secrets`, and nothing here deploys.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Data, tests and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate corpus, provenance and schemas
        run: python -m kotoba.cli validate --json > validation-report.json || (cat validation-report.json; exit 1)

      - name: Confirm NOTICE.md is up to date
        run: |
          cp NOTICE.md NOTICE.md.committed
          python -m kotoba.cli validate --write-notice >/dev/null
          diff -u NOTICE.md.committed NOTICE.md || {
            echo "::error::NOTICE.md is stale; run 'make notice' and commit the result"
            exit 1
          }

      - name: Run tests
        run: python -m pytest -q

      - name: Build the static site
        # A short horizon: CI is checking correctness, not producing a
        # deployable artefact. pages.yml builds the full ten-year range.
        run: python -m kotoba.cli build-site --output site --past-days 7 --future-days 60

      - name: Validate the generated API
        run: python -m kotoba.cli validate-site --site site

      - name: Summarise the build
        run: |
          python -m kotoba.cli manifest --site site >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            validation-report.json
            site/api/v1/manifest.json
            site/health.json
          if-no-files-found: warn

  plugin:
    name: Plugin lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install trmnlp
        run: gem install trmnl_preview

      - name: Lint the plugin
        run: trmnlp lint

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install Japanese fonts
        # The runner has no CJK coverage by default, so a render would come
        # out as tofu boxes and prove nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Render every view for every fixture
        # HTML for all fixtures always; PNGs too, since the runner has a
        # browser. Renders run against the locally installed trmnlp, so no
        # Docker image is needed here.
        run: python scripts/render_fixtures.py --png

      - name: Package the manual-import ZIP
        run: python scripts/package_plugin.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            dist/renders/**
            dist/*.zip
          if-no-files-found: error
