#
# TRMNL private plugin definition.
#
# `trmnlp push` rewrites this file, so comments here are lost on the next
# push. Anything that needs explaining lives in docs/deployment.md.
#
# `id` is the plugin created by the first push. CI refuses to deploy without
# it, so that it updates this plugin rather than creating a new one each run.
# The id is not a secret; TRMNL_API_KEY is.
#
# polling_url adds the device's UTC offset to the server clock before
# formatting the date, so the word turns over at local midnight.
#
---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
polling_url: '{{ data_base_url }}/daily/{{ jlpt_level }}/{{ "now" | date: "%s" | plus: trmnl.user.utc_offset | date: "%Y-%m-%d" }}.json'
polling_headers: ''
polling_body:
id: 410659
custom_fields:
- keyname: jlpt_level
  field_type: select
  name: Learner level
  description: Which JLPT-aligned vocabulary level to practise.
  help_text: N5 is the easiest level and N1 the hardest.
  options:
  - N5 — beginner: n5
  - N4 — elementary: n4
  - N3 — intermediate: n3
  - N2 — upper-intermediate: n2
  - N1 — advanced: n1
  default: n5
- keyname: show_example_translation
  field_type: boolean
  name: Show example translation?
  description: Show the English translation beneath the Japanese example.
  help_text: Hidden automatically in the smaller layouts.
  default: false
  optional: true
- keyname: show_rotation_progress
  field_type: boolean
  name: Show rotation progress?
  description: Add the current position in the rotation to the title bar.
  help_text: Off by default to keep the screen sparse.
  default: false
  optional: true
- keyname: data_base_url
  field_type: url
  name: Data endpoint
  description: Base URL of the generated vocabulary API. No trailing slash.
  help_text: Leave this alone unless you are hosting your own copy of the data.
  group: Advanced
  placeholder: https://simonjgreen.github.io/trmnl-japanese-vocab/api/v1
  default: https://simonjgreen.github.io/trmnl-japanese-vocab/api/v1
name: Kotoba — JLPT Word of the Day
description: JLPT-aligned Japanese vocabulary
refresh_interval: 1440
