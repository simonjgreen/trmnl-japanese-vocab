---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language:
polling_url: '{{ data_base_url }}/daily/{{ jlpt_level }}/{{ "now" | date: "%s" | plus: trmnl.user.utc_offset | date: "%Y-%m-%d" }}.json'
polling_headers: ''
polling_body:
id: 410659
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: jlpt_level
  field_type: select
  name: Learner level
  description: Cards are drawn from this level and every easier one.
  help_text: Choosing N3 shows N5, N4 and N3 words together.
  options:
  - N5 — beginner: n5
  - N4 — elementary: n4
  - N3 — intermediate: n3
  - N2 — upper-intermediate: n2
  - N1 — advanced: n1
  default: n5
- keyname: show_example_translation
  field_type: boolean
  name: Show example translation?
  description: Show the English translation beneath the Japanese example.
  help_text: Hidden automatically in the smaller layouts.
  default: false
  optional: true
- keyname: show_rotation_progress
  field_type: boolean
  name: Show rotation progress?
  description: Add the card's position in the whole deck to the title bar.
  help_text: Off by default to keep the screen sparse.
  default: false
  optional: true
- keyname: data_base_url
  field_type: url
  name: Data endpoint
  description: Base URL of the generated vocabulary API. No trailing slash.
  help_text: Leave this alone unless you are hosting your own copy of the data.
  group: Advanced
  placeholder: https://simonjgreen.github.io/trmnl-japanese-vocab/api/v1
  default: https://simonjgreen.github.io/trmnl-japanese-vocab/api/v1
name: Kotoba — JLPT Word of the Day
description: JLPT-aligned Japanese vocabulary
refresh_interval: 15
