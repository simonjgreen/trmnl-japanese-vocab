---
# Flash cards as one file per time slot.
#
# TRMNL skips rendering when a polled payload is byte-identical to the last
# one ("Render skipped — no change in data" in its activity log). A deck in a
# per-date file therefore renders once a day however clever the template is.
# The card must differ per slot in the *data*, so each slot is its own file
# and the polling URL selects it from the clock.
#
# A pleasant side effect: no dates in the URL means the API can never run out
# of them, so there is no horizon to keep rolling forward and no 404 risk from
# a stalled schedule.
slots:
  # How long one card stays up. Kept below TRMNL's 15-minute maximum refresh
  # rate so consecutive polls always land in different slots; at exactly 15
  # minutes a poll arriving early would sometimes repeat a card.
  seconds: 600

  # How many slot files per level. 4096 x 600s is just over 28 days before the
  # sequence repeats, at 4096 x 5 = 20,480 small files.
  #
  # This number is duplicated in the polling URL in src/settings.yml, because
  # a Liquid modulo needs a literal. A test asserts the two agree.
  count: 4096

payload:
  recommended_bytes: 2048
  hard_limit_bytes: 8192
  minify: true

# `demo` relaxes the per-level minimum; `production` enforces it.
status: production
minimum_entries_per_level: 100
