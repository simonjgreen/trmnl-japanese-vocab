# Provenance register. Every canonical record must reference at least one
# source declared here, and NOTICE.md is generated from this file.
#
# The code in this repository is MIT licensed. The vocabulary data is not: it
# is derived from the sources below and inherits their terms. JMdict is
# CC BY-SA 4.0, so the compiled corpus is CC BY-SA 4.0 as well.
#
# Each downloaded source records the SHA-256 of every file it puts into
# data/raw, and scripts/fetch_sources.py checks the downloads against them.
# The `upstream` key says how much authority those digests carry, because the
# two kinds of source are not comparable:
#
#   pinned        The URL names an immutable release artefact. A digest change
#                 means corruption, a truncated download or a re-tagged
#                 release, and is always an error.
#   head-tracked  The URL follows a branch head, so upstream can legitimately
#                 change under us. A digest change is a warning inviting a
#                 review of the canonical diff, not a failure.
#
# Digests are recorded with `scripts/fetch_sources.py --update-checksums`,
# which will not overwrite an existing digest without an explicit flag, so a
# corrupt download cannot be laundered into the register by rerunning it.
sources:
  - id: jlpt-waller
    name: Jonathan Waller's JLPT Resources, via stephenmk/yomitan-jlpt-vocab
    homepage: https://github.com/stephenmk/yomitan-jlpt-vocab
    retrieved: '2026-08-09'
    version: HEAD (original_data/n1..n5.csv)
    licence: CC-BY-SA-4.0
    licence_url: https://creativecommons.org/licenses/by-sa/4.0/
    attribution: >-
      JLPT level estimates compiled by Jonathan Waller
      (http://www.tanos.co.uk/jlpt/, Creative Commons Attribution licence),
      redistributed with JMdict entry identifiers by stephenmk/yomitan-jlpt-vocab
      under CC BY-SA 4.0.
    fields_used:
      - jmdict_seq
      - kana
      - kanji
      - waller_definition
    upstream: head-tracked
    files:
      - path: data/raw/jlpt/n1.csv
        sha256: 7a58f0584e9ec2b0299ccb9b109f3bd03e08b90d129a714307c0a1cb72f07b32
      - path: data/raw/jlpt/n2.csv
        sha256: 42a4413326e857d701dc9659b2711637ab612304a339fe0d09f4f0f042d3a214
      - path: data/raw/jlpt/n3.csv
        sha256: bd4d68c59cfee861351e1bdf9d99818e434392201eabbed4d3657225fe53a3ac
      - path: data/raw/jlpt/n4.csv
        sha256: a14dcc7fdc02259b22331a486c6ff66df74c16472c8aeb5a0ebe7e5fa8ee8eb4
      - path: data/raw/jlpt/n5.csv
        sha256: 07dc6f197b51cc076c65c3c9f23218d10c2b67f76545f5c1c4d9e3750495533a
    redistribution_notes: >-
      Level assignments are community estimates, not an official JLPT
      specification. The Japan Foundation and JEES stopped publishing
      vocabulary lists in 2010. These lists are over a decade old and are the
      same data shown by jisho.org. They must never be described as official
      or endorsed.

  - id: jmdict
    name: JMdict, via scriptin/jmdict-simplified
    homepage: https://www.edrdg.org/wiki/index.php/JMdict-EDICT_Dictionary_Project
    retrieved: '2026-08-09'
    version: 3.6.2+20260803141815 (jmdict-examples-eng)
    licence: CC-BY-SA-4.0
    licence_url: https://www.edrdg.org/edrdg/licence.html
    attribution: >-
      JMdict is the property of the Electronic Dictionary Research and
      Development Group, and is used in conformance with the Group's licence.
      The project was started in 1991 by Jim Breen. JSON conversion by
      scriptin/jmdict-simplified, distributed under the same licence.
    fields_used:
      - id
      - sense.gloss
      - sense.partOfSpeech
      - sense.examples
    upstream: pinned
    files:
      # The digest is of the extracted JSON rather than the .tgz that is
      # downloaded: the archive is deleted after extraction, so the JSON is the
      # only artefact left to check on a later run.
      - path: data/raw/jmdict-examples-eng.json
        sha256: 924f8297cec4d48eb4a313cc01dcd91f866908468a650bf162c0a9756f2657d0
    redistribution_notes: >-
      EDRDG requires that the usage and source of the files be acknowledged in
      documentation, publicity material and the project website, and that
      links to the licence be provided. Adding material to the files does not
      diminish the Group's copyright; no copyright is claimed here over the
      JMdict-derived content. Attribution is carried in README.md, NOTICE.md,
      the generated Pages index and the plugin description.

  - id: jmdict-furigana
    name: JmdictFurigana by Doublevil
    homepage: https://github.com/Doublevil/JmdictFurigana
    retrieved: '2026-08-09'
    version: 2.3.1+2026-07-25
    licence: CC-BY-SA-4.0
    licence_url: https://creativecommons.org/licenses/by-sa/4.0/
    attribution: >-
      Furigana segmentation from JmdictFurigana by Doublevil, distributed under
      the same licence as JMdict (Creative Commons Attribution-ShareAlike).
    fields_used:
      - surface
      - reading
      - ruby segment offsets
    upstream: pinned
    files:
      - path: data/raw/JmdictFurigana.txt
        sha256: 2d5a6a11195ecfbaa56586720fa4e869e5db146eb2973683161fa54fce3936d7
    redistribution_notes: >-
      The repository's LICENSE file states MIT, which covers the C# generator.
      The README states the data is distributed under the same licence as
      JMdict. As a JMdict derivative the data is treated here as CC BY-SA 4.0,
      which is the stricter and safer reading.

  - id: tatoeba
    name: Tatoeba Project example sentences
    homepage: https://tatoeba.org/
    retrieved: '2026-08-09'
    version: via jmdict-examples-eng 3.6.2+20260803141815
    licence: CC-BY-2.0-FR
    licence_url: https://creativecommons.org/licenses/by/2.0/fr/
    attribution: >-
      Example sentences from the Tatoeba Project (https://tatoeba.org/),
      licensed CC BY 2.0 FR, selected and sense-aligned by the EDRDG examples
      build. Individual sentence authors are credited on Tatoeba; each entry
      records its Tatoeba sentence ID, which resolves to
      https://tatoeba.org/en/sentences/show/<id>.
    fields_used:
      - sentence text (Japanese)
      - sentence text (English)
      - sentence id
    redistribution_notes: >-
      Tatoeba's terms ask for attribution of the individual sentence author.
      The upstream export carries only the numeric sentence ID, not the author
      name, so attribution here is at sentence-ID level plus a project-level
      credit. This is the customary practice for JMdict-derived example data
      and is a pragmatic rather than literal reading of the per-author clause.
